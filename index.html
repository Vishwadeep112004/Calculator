<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="cs.css" />
  </head>
  <body>

      </div>
      <div class="buttons">

        <button class="button_special">C</button>

        <button class="button_special">x³</button>

        <button class="button">3</button>
